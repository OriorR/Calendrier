<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3D0A14">
<title>Pour toi, p'tit cœur</title>
<meta name="description" content="Un calendrier de l'avent, une case par jour jusqu'à Noël.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M60 50 C47 44 44 30 52 18 C53 26 57 29 60 26 C59 16 63 8 71 3 C69 14 78 20 76 34 C74 44 67 50 60 50 Z' fill='%23E2B04A'/%3E%3Cpath d='M60 104 C20 74 10 52 10 38 C10 22 22 12 36 12 C46 12 55 18 60 27 C65 18 74 12 84 12 C98 12 110 22 110 38 C110 52 100 74 60 104 Z' fill='%23C8102E' transform='translate(60 72) scale(0.82) translate(-60 -58)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="P'tit cœur">
<!-- Aperçu du lien quand tu l'envoies par message. Après la mise en ligne, remplace TON-SITE par l'adresse donnée par Vercel. -->
<meta property="og:title" content="Pour toi, p'tit cœur">
<meta property="og:description" content="Un calendrier de l'avent, une case par jour jusqu'à Noël.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://TON-SITE.vercel.app/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Texture partagée par tous les autocollants : tissage léger -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="2.5" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect y="2.5" width="2.5" height="2.5" fill="#000000" fill-opacity="0.08"/>
    </pattern>
  </defs>
</svg>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="content-error" id="content-error" hidden>Le contenu n'a pas pu se charger : il y a sûrement une petite erreur dans content.js (une virgule ou un guillemet oublié près de ta dernière modification).</div>

<main class="app">
  <header class="head">
    <p class="eyebrow">Calendrier de l'avent · Décembre 2026</p>
    <h1>
      <span id="title-1"></span>
      <span class="title-2"><em id="title-2"></em>
        <svg class="flame-heart" viewBox="0 0 120 120" aria-hidden="true">
          <path class="fh-flame" d="M60 50 C47 44 44 30 52 18 C53 26 57 29 60 26 C59 16 63 8 71 3 C69 14 78 20 76 34 C74 44 67 50 60 50 Z" fill="#E2B04A"/>
          <path d="M60 104 C20 74 10 52 10 38 C10 22 22 12 36 12 C46 12 55 18 60 27 C65 18 74 12 84 12 C98 12 110 22 110 38 C110 52 100 74 60 104 Z" fill="#C8102E" transform="translate(60 72) scale(0.82) translate(-60 -58)"/>
        </svg>
      </span>
    </h1>
    <p class="sub">Une case par jour. Chacune s'ouvre à minuit.</p>
  </header>

  <section class="mystery" id="mystery" aria-label="Mot mystère"></section>

  <section class="heart" id="grid" aria-label="Les 24 cases du calendrier"></section>

  <footer class="foot">
    <p class="countdown" id="countdown"></p>
    <p class="hint">Tu peux toucher une case déjà ouverte pour la relire.</p>
  </footer>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden>
  <div class="scrim" id="scrim"></div>
  <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <div class="card-sticker" id="card-sticker"></div>
    <button class="card-x" id="card-x" type="button" aria-label="Fermer la case">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <div class="card-inner" id="card-inner">
      <p class="card-date" id="card-date"></p>
      <h2 class="card-title" id="card-title"></h2>
      <div class="blocks" id="blocks"></div>
      <div class="block block-actions">
        <button class="btn" id="card-close" type="button">Refermer la case</button>
      </div>
    </div>
  </article>
</div>

<script src="vendor/qrcode.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
